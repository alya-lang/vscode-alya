name: 🐛 Bug Report
description: Report an issue or unexpected behavior in the Alya VS Code extension
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us diagnose and resolve the bug quickly.

  - type: input
    id: ext_version
    attributes:
      label: Alya Extension Version
      description: What version of the Alya extension are you using? (e.g. 0.2.1)
      placeholder: "e.g. 0.2.1"
    validations:
      required: true

  - type: input
    id: vscode_version
    attributes:
      label: VS Code Version
      description: What version of VS Code are you using? (Help -> About)
      placeholder: "e.g. 1.93.0"
    validations:
      required: true

  - type: input
    id: alya_version
    attributes:
      label: Alya Compiler Version
      description: Run `alya --version` in your terminal
      placeholder: "e.g. alya 0.0.18"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running VS Code on?
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open a file called '...'
        2. Type code snippet '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Language Server Logs
      description: Output from the "Alya Language Server" panel (View -> Output -> select Alya Language Server).
      render: shell
